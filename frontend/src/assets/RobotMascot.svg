<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Head -->
  <rect x="50" y="40" width="100" height="80" rx="10" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>

  <!-- Left Eye -->
  <circle cx="75" cy="65" r="12" fill="#06B6D4"/>
  <circle cx="75" cy="65" r="8" fill="white"/>
  <circle cx="75" cy="65" r="5" fill="#1E40AF"/>

  <!-- Right Eye -->
  <circle cx="125" cy="65" r="12" fill="#06B6D4"/>
  <circle cx="125" cy="65" r="8" fill="white"/>
  <circle cx="125" cy="65" r="5" fill="#1E40AF"/>

  <!-- Mouth -->
  <path d="M 85 90 Q 100 100 115 90" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Antenna -->
  <line x1="100" y1="40" x2="100" y2="10" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="8" r="6" fill="#34D399"/>

  <!-- Body -->
  <rect x="60" y="130" width="80" height="50" rx="5" fill="#10B981" stroke="#059669" stroke-width="2"/>

  <!-- Buttons -->
  <circle cx="85" cy="150" r="5" fill="#F59E0B"/>
  <circle cx="100" cy="150" r="5" fill="#A855F7"/>
  <circle cx="115" cy="150" r="5" fill="#EF4444"/>

  <!-- Chest Light -->
  <rect x="90" y="165" width="20" height="8" rx="2" fill="#06B6D4"/>
</svg>
